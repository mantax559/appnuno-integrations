name: appnuno-wordpress-live

services:
  mysql:
    volumes:
      - wordpress-live-db:/var/lib/mysql

  wordpress:
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"

  live-init:
    image: wordpress:cli-php${PHP_VERSION:-8.3}
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/prepare-store.sh"]
    environment:
      WORDPRESS_VERSION: ${WORDPRESS_VERSION:-7.1.4}
      WOOCOMMERCE_VERSION: ${WOOCOMMERCE_VERSION:-11.2.1}
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_SITE_URL: http://127.0.0.1:${WORDPRESS_PORT:-8080}
      WORDPRESS_ADMIN_USER: admin
      WORDPRESS_ADMIN_PASSWORD: appnuno-local
      WORDPRESS_ADMIN_EMAIL: admin@example.test
      APPNUNO_INSTALL_PLUGIN: ${APPNUNO_INSTALL_PLUGIN:-}
      APPNUNO_WOOCOMMERCE_LINE: ${APPNUNO_WOOCOMMERCE_LINE:-11.x}
    volumes:
      - store-workspace:/var/www/html
      - ./prepare-store.sh:/scripts/prepare-store.sh:ro
      - ./mu-plugins/appnuno-languages.php:/scripts/appnuno-languages.php:ro
      - ../../../../downloads/woocommerce/${APPNUNO_WOOCOMMERCE_LINE:-11.x}:/appnuno/package:ro
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  wordpress-live-db:
