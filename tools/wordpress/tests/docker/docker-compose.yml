name: appnuno-wordpress-tests

services:
  mysql:
    image: mysql:8.4
    command: --mysql-native-password=ON --authentication_policy=mysql_native_password --character-set-server=utf8mb3 --collation-server=utf8mb3_general_ci --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - ./mysql/native-password.sql:/docker-entrypoint-initdb.d/native-password.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h127.0.0.1 -uwordpress -pwordpress -e 'SELECT 1' >/dev/null && mysql -uroot -proot -N -e \"SELECT COUNT(*) FROM mysql.user WHERE user='wordpress' AND plugin='mysql_native_password'\" | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  wordpress:
    image: appnuno-wordpress:${WORDPRESS_VERSION:-7.1.4}
    build:
      context: ..
      dockerfile: docker/Dockerfile.wordpress
      args:
        WORDPRESS_VERSION: ${WORDPRESS_VERSION:-7.1.4}
        PHP_VERSION: ${PHP_VERSION:-8.3}
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - store-workspace:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit((int) !@fsockopen('127.0.0.1', 80));"]
      interval: 5s
      timeout: 3s
      retries: 20

  installer:
    image: appnuno-wordpress-cli:${PHP_VERSION:-8.3}
    build:
      context: ..
      dockerfile: docker/Dockerfile.cli
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        WP_CLI_VERSION: ${WP_CLI_VERSION:-}
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/prepare-store.sh"]
    environment:
      WORDPRESS_VERSION: ${WORDPRESS_VERSION:-7.1.4}
      WOOCOMMERCE_VERSION: ${WOOCOMMERCE_VERSION:-11.2.1}
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_SITE_URL: http://127.0.0.1:${WORDPRESS_PORT:-8080}
      WORDPRESS_ADMIN_USER: admin
      WORDPRESS_ADMIN_PASSWORD: appnuno-local
      WORDPRESS_ADMIN_EMAIL: admin@example.test
      WP_CLI_VERSION: ${WP_CLI_VERSION:-}
      APPNUNO_INSTALL_PLUGIN: ${APPNUNO_INSTALL_PLUGIN:-}
      APPNUNO_WOOCOMMERCE_LINE: ${APPNUNO_WOOCOMMERCE_LINE:-11.x}
    volumes:
      - store-workspace:/var/www/html
      - ./prepare-store.sh:/scripts/prepare-store.sh:ro
      - ./mu-plugins/appnuno-languages.php:/scripts/appnuno-languages.php:ro
      - ../../../../downloads/woocommerce/${APPNUNO_WOOCOMMERCE_LINE:-11.x}:/appnuno/package:ro
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  store-workspace:
