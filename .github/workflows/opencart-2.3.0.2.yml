name: OpenCart 2.3.0.2 compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-22.04
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: opencart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          extensions: curl, ftp, gd, mysqli, zip, mcrypt, mbstring, xml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pymysql pyftpdlib
          python -m playwright install --with-deps chromium

      - name: Build and validate extension package
        run: |
          php tools/opencart/2.3.0.2/build-package.php
          php tools/opencart/2.3.0.2/tests/package-validation.php
          php tools/opencart/2.3.0.2/tests/config-validation.php

      - name: Install OpenCart and run browser integration test
        env:
          OPENCART_DB_HOST: 127.0.0.1
          OPENCART_DB_USER: root
          OPENCART_DB_PASSWORD: root
          OPENCART_DB_NAME: opencart
        run: python tools/opencart/2.3.0.2/tests/integration.py
