            woocommerce_version: "1.1.3"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.2"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.2.1"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.2.2"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.2.3"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.2.4"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.3"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.3.1"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.3.2"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.4"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.4.1"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.4.2"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.4.3"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.4.4"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.5"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.5.1"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.5.2"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.5.2.1"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.5.3"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.5.4"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.5.5"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.5.6"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.5.7"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.5.7.1"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.5.8"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.6.0"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.6.1"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.6.2"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.6.3"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.6.4"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.6.5"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.6.5.1"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.6.5.2"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.6.6"
            php_version: "5.6"
    env:
      WORDPRESS_VERSION: ${{ matrix.wordpress_version }}
      WOOCOMMERCE_VERSION: ${{ matrix.woocommerce_version }}
      PHP_VERSION: ${{ matrix.php_version }}
      APPNUNO_WOOCOMMERCE_LINE: "1.x"
      WP_CLI_VERSION: "0.12.1"

    steps:
      - uses: actions/checkout@v6

      - name: Prepare PHP for the WooCommerce package build
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zip
          coverage: none

      - name: Build the WooCommerce 1.x package
        run: php tools/wordpress/build-package.php 1

      - name: Install WordPress ${{ matrix.wordpress_version }} and WooCommerce ${{ matrix.woocommerce_version }} using PHP ${{ matrix.php_version }}
        env:
          APPNUNO_INSTALL_PLUGIN: "1"
        run: docker compose -f tools/wordpress/tests/docker/docker-compose.yml up --build --abort-on-container-exit --exit-code-from installer installer

      - name: Remove the temporary WordPress environment
        if: always()
        run: docker compose -f tools/wordpress/tests/docker/docker-compose.yml down --volumes --remove-orphans
