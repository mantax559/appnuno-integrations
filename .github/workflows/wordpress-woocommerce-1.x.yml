name: WordPress and WooCommerce 1.x compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.0"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.0.1"
            php_version: "5.6"
          - wordpress_version: "3.4.2"
            woocommerce_version: "1.0.2"
            php_version: "5.6"
