name: PrestaShop installation compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  installation:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop-tag: '8.2-apache'
          - prestashop-tag: '9.0-apache'
    steps:
      - uses: actions/checkout@v6

      - name: Install PrestaShop ${{ matrix.prestashop-tag }} with MySQL and verify installation
        env:
          PRESTASHOP_TAG: ${{ matrix.prestashop-tag }}
        run: docker compose -f tools/prestashop/tests/docker/docker-compose.yml up --abort-on-container-exit --exit-code-from installer-check installer-check

      - name: Remove the temporary PrestaShop environment
        if: always()
        run: docker compose -f tools/prestashop/tests/docker/docker-compose.yml down --volumes --remove-orphans
