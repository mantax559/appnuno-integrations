      WOOCOMMERCE_VERSION: ${{ matrix.woocommerce_version }}
      PHP_VERSION: ${{ matrix.php_version }}

    steps:
      - uses: actions/checkout@v6

      - name: Install WordPress ${{ matrix.wordpress_version }} and WooCommerce ${{ matrix.woocommerce_version }} using PHP ${{ matrix.php_version }}
        run: docker compose -f tools/wordpress/tests/docker-compose.yml up --build --abort-on-container-exit --exit-code-from installer installer

      - name: Remove the temporary WordPress environment
        if: always()
        run: docker compose -f tools/wordpress/tests/docker-compose.yml down --volumes --remove-orphans
