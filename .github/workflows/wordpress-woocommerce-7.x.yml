            woocommerce_version: "7.9.2"
            php_version: "7.3"
            compatibility_target: "tested-up-to"
    env:
      WORDPRESS_VERSION: ${{ matrix.wordpress_version }}
      WOOCOMMERCE_VERSION: ${{ matrix.woocommerce_version }}
      PHP_VERSION: ${{ matrix.php_version }}
      APPNUNO_WOOCOMMERCE_LINE: "7.x"

    steps:
      - uses: actions/checkout@v6

      - name: Prepare PHP for the WooCommerce package build
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zip
          coverage: none

      - name: Build the WooCommerce 7.x package
        run: php tools/wordpress/build-package.php 7

      - name: Install WordPress ${{ matrix.wordpress_version }} and WooCommerce ${{ matrix.woocommerce_version }} using PHP ${{ matrix.php_version }}
        if: ${{ !(matrix.wordpress_version == '6.2.15' && matrix.woocommerce_version == '7.9.2' && matrix.compatibility_target == 'tested-up-to') }}
        env:
          APPNUNO_INSTALL_PLUGIN: "1"
        run: docker compose -f tools/wordpress/tests/docker/docker-compose.yml up --build --abort-on-container-exit --exit-code-from installer installer

      - name: Install WordPress 6.2.15 and WooCommerce 7.9.2 and keep the store running
        if: ${{ matrix.wordpress_version == '6.2.15' && matrix.woocommerce_version == '7.9.2' && matrix.compatibility_target == 'tested-up-to' }}
        env:
          APPNUNO_INSTALL_PLUGIN: "1"
        run: docker compose -f tools/wordpress/tests/docker/docker-compose.yml -f tools/wordpress/tests/docker/docker-compose.live.yml up -d --build mysql wordpress && docker compose -f tools/wordpress/tests/docker/docker-compose.yml -f tools/wordpress/tests/docker/docker-compose.live.yml run --rm installer

      - name: Check the AppNuno admin and storefront
        if: ${{ matrix.wordpress_version == '6.2.15' && matrix.woocommerce_version == '7.9.2' && matrix.compatibility_target == 'tested-up-to' }}
        env:
          APPNUNO_ARTIFACT_DIR: ${{ runner.temp }}/wordpress-artifacts
        run: |
          python3 -m pip install -r tools/wordpress/tests/requirements-ci.txt
          python3 -m playwright install chromium
          python3 tools/wordpress/tests/integration/admin.py

      - name: Upload browser test artifacts
        if: ${{ always() && matrix.wordpress_version == '6.2.15' && matrix.woocommerce_version == '7.9.2' && matrix.compatibility_target == 'tested-up-to' }}
        uses: actions/upload-artifact@v7
        with:
          name: wordpress-woocommerce-7.9.2-browser-artifacts
          path: ${{ runner.temp }}/wordpress-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Remove the temporary WordPress environment
        if: always()
        run: docker compose -f tools/wordpress/tests/docker/docker-compose.yml -f tools/wordpress/tests/docker/docker-compose.live.yml down --volumes --remove-orphans
