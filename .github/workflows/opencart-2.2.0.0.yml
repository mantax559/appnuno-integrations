name: OpenCart 2.2 compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        opencart-version: ['2.2.0.0']
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: opencart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6

      - name: Check out storefront SDK source
        uses: actions/checkout@v6
        with:
          repository: mantax559/appnuno-web
          ref: production
          path: appnuno-web
          token: ${{ secrets.ACTIONS_READ_TOKEN || github.token }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          extensions: curl, ftp, gd, mysqli, zip, mcrypt, mbstring, xml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install browser test dependencies
        run: |
          python -m pip install -r tools/opencart/2.3.0.2/tests/requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Build and validate extension package reproducibly
        env:
          TZ: UTC
        run: |
          php tools/opencart/2.3.0.2/build-package.php 2.2
          first_hash=$(sha256sum downloads/opencart/2.2/appnuno-opencart-2.2.ocmod.zip | cut -d ' ' -f 1)
          php tools/opencart/2.3.0.2/build-package.php 2.2
          second_hash=$(sha256sum downloads/opencart/2.2/appnuno-opencart-2.2.ocmod.zip | cut -d ' ' -f 1)
          test "$first_hash" = "$second_hash"
          php tools/opencart/2.3.0.2/tests/package-validation.php 2.2
          php tools/opencart/2.3.0.2/tests/config-validation.php

      - name: Install OpenCart ${{ matrix.opencart-version }} and run browser integration test
        env:
          OPENCART_VERSION: ${{ matrix.opencart-version }}
          OPENCART_DB_HOST: 127.0.0.1
          OPENCART_DB_USER: root
          OPENCART_DB_PASSWORD: root
          OPENCART_DB_NAME: opencart
          OPENCART_ARTIFACT_DIR: ${{ runner.temp }}/opencart-artifacts/${{ matrix.opencart-version }}
          APPNUNO_SDK_SOURCE: ${{ github.workspace }}/appnuno-web/public/sdk/v1/appnuno.js
        run: python tools/opencart/2.3.0.2/tests/integration.py

      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencart-${{ matrix.opencart-version }}-browser-artifacts
          path: ${{ runner.temp }}/opencart-artifacts/${{ matrix.opencart-version }}
          if-no-files-found: warn
          retention-days: 7
