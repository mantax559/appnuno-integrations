name: WordPress and WooCommerce 11.x compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress_version: "6.9.11"
            woocommerce_version: "11.0.0"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.0.0"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
          - wordpress_version: "6.9.11"
            woocommerce_version: "11.0.1"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.0.1"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.1.0"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.1.4"
            woocommerce_version: "11.1.0"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.1.1"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.1.4"
            woocommerce_version: "11.1.1"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.1.2"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.1.4"
            woocommerce_version: "11.1.2"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.2.0"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.1.4"
            woocommerce_version: "11.2.0"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.2.1"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.1.4"
            woocommerce_version: "11.2.1"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
    env:
      WORDPRESS_VERSION: ${{ matrix.wordpress_version }}
      WOOCOMMERCE_VERSION: ${{ matrix.woocommerce_version }}
      PHP_VERSION: ${{ matrix.php_version }}

    steps:
      - uses: actions/checkout@v6

      - name: Prepare PHP for the WooCommerce package build
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zip
          coverage: none

      - name: Build the WooCommerce 11.x package
        run: php tools/wordpress/build-package.php

      - name: Install WordPress ${{ matrix.wordpress_version }} and WooCommerce ${{ matrix.woocommerce_version }} using PHP ${{ matrix.php_version }}
        if: ${{ !(matrix.wordpress_version == '7.1.4' && matrix.woocommerce_version == '11.2.1' && matrix.compatibility_target == 'tested-up-to') }}
        env:
          APPNUNO_INSTALL_PLUGIN: "1"
        run: docker compose -f tools/wordpress/tests/docker/docker-compose.yml up --build --abort-on-container-exit --exit-code-from installer installer

      - name: Install WordPress 7.1.4 and WooCommerce 11.2.1 and keep the store running
        if: ${{ matrix.wordpress_version == '7.1.4' && matrix.woocommerce_version == '11.2.1' && matrix.compatibility_target == 'tested-up-to' }}
        env:
          APPNUNO_INSTALL_PLUGIN: "1"
        run: docker compose -f tools/wordpress/tests/docker/docker-compose.yml -f tools/wordpress/tests/docker/docker-compose.live.yml up -d --build mysql wordpress && docker compose -f tools/wordpress/tests/docker/docker-compose.yml -f tools/wordpress/tests/docker/docker-compose.live.yml run --rm installer

      - name: Check the AppNuno admin and storefront
        if: ${{ matrix.wordpress_version == '7.1.4' && matrix.woocommerce_version == '11.2.1' && matrix.compatibility_target == 'tested-up-to' }}
        env:
          APPNUNO_ARTIFACT_DIR: ${{ runner.temp }}/wordpress-artifacts
        run: |
          python3 -m pip install -r tools/wordpress/tests/requirements-ci.txt
          python3 -m playwright install --with-deps chromium
          python3 tools/wordpress/tests/integration/admin.py

      - name: Upload browser test artifacts
        if: ${{ always() && matrix.wordpress_version == '7.1.4' && matrix.woocommerce_version == '11.2.1' && matrix.compatibility_target == 'tested-up-to' }}
        uses: actions/upload-artifact@v7
        with:
          name: wordpress-woocommerce-11.2.1-browser-artifacts
          path: ${{ runner.temp }}/wordpress-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Remove the temporary WordPress environment
        if: always()
        run: docker compose -f tools/wordpress/tests/docker/docker-compose.yml -f tools/wordpress/tests/docker/docker-compose.live.yml down --volumes --remove-orphans
