name: WordPress and WooCommerce 11.x compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress_version: "6.9.11"
            woocommerce_version: "11.0.0"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.0.0"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
          - wordpress_version: "6.9.11"
            woocommerce_version: "11.0.1"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.0.1"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.1.0"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.1.4"
            woocommerce_version: "11.1.0"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.1.1"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.1.4"
            woocommerce_version: "11.1.1"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.1.2"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.1.4"
            woocommerce_version: "11.1.2"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.2.0"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.1.4"
            woocommerce_version: "11.2.0"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
          - wordpress_version: "7.0.8"
            woocommerce_version: "11.2.1"
            php_version: "7.4"
            compatibility_target: "requires-at-least"
          - wordpress_version: "7.1.4"
            woocommerce_version: "11.2.1"
            php_version: "7.4"
            compatibility_target: "tested-up-to"
    env:
      WORDPRESS_VERSION: ${{ matrix.wordpress_version }}
      WOOCOMMERCE_VERSION: ${{ matrix.woocommerce_version }}
      PHP_VERSION: ${{ matrix.php_version }}

    steps:
      - uses: actions/checkout@v6

      - name: Install WordPress ${{ matrix.wordpress_version }} and WooCommerce ${{ matrix.woocommerce_version }} using PHP ${{ matrix.php_version }}
        run: docker compose -f tools/wordpress/tests/docker-compose.yml up --build --abort-on-container-exit --exit-code-from installer installer

      - name: Remove the temporary WordPress environment
        if: always()
        run: docker compose -f tools/wordpress/tests/docker-compose.yml down --volumes --remove-orphans
